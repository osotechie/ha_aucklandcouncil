name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install latest Ruff
        run: python -m pip install --upgrade ruff

      - name: Run ruff check
        run: python -m ruff check custom_components tests

      - name: Run ruff format check
        run: python -m ruff format --check custom_components tests

  test:
    name: Test (Home Assistant / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install latest development dependencies
        run: python -m pip install --upgrade -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --tb=short --junitxml=test-results.xml

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (Home Assistant / Python 3.14)
          path: test-results.xml
          reporter: java-junit
